[workflow]
input_cohorts = []

sequencing_type= 'genome'
# used to make sure we don't repeat previously completed stages
check_expected_outputs = true

# the method to register outputs, can be missing - will not generate metamist analysis entries
status_reporter = 'metamist'

[images]
stripy = "australia-southeast1-docker.pkg.dev/cpg-common/images/stripy:v2.5_91a4ad-1"

[stripy]
# Analysis_type can be "standard" (fast) or "extended" (marginally slower but also uses unmapped reads for genotying)
analysis_type = "extended"
subset_svg_flag_threshold = 1
# Update the stripy config.json file, default found here:
# https://gitlab.com/andreassh/stripy-pipeline/-/blob/main/config.json?ref_type=heads

# if this is true, the `--locus ...` flag to trigger loci in the STRipy built-in catalogue will be removed
# meaning all loci and thresholds are entirely from the custom config
custom_bed_only = false

# if true, we permit a situation where a CPG ID has no metadata, so it will be given dummy values
allow_missing_meta = false

[stripy.config]
output_svg_flag_threshold = 0
log_flag_threshold = -1
output_html = true
output_json = true
verbose = true

[references]
ensembl_gff3 = "gs://cpg-common-main/references/ensembl_116/GRCh38_chrM_renamed.gff3.gz"

[stripy_vcf]
storage = '50GiB'
